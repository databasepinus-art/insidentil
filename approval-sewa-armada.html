<style>
/* Layout: operations console — sticky top bar, one working column (max 1180px), detail opens as a side panel */

:root[data-theme="dark"]{

  --accent:#E8735F; --accent-ink:#1A0E0B;

*{box-sizing:border-box}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}

.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

.acts{display:flex;gap:6px;flex-wrap:wrap}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
label.f input,label.f select,.in{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:8px 10px;color:var(--ink);min-width:0;width:100%}
.in.tight{padding:5px 8px;width:86px}

.notice.err{background:var(--sewa-bg);color:var(--sewa)}
.notice.info{background:var(--ok-bg);color:var(--ok)}
.syncbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.syncbar b{color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600;color:var(--ink)}
.verdict{border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.verdict.sewa{background:var(--sewa-bg);color:var(--sewa)}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.wait{background:var(--wait-bg);color:var(--wait)}
.verdict .big{font-size:24px;font-weight:700;font-family:var(--font-title)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 16px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px}
.login{min-height:calc(100vh - 140px);display:grid;place-items:center;padding-block:24px}
.login .card{width:min(420px,100%);gap:16px;padding:28px}
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:41;overflow-y:auto;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;z-index:2}
.panel-body{padding:18px;display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)} .small{font-size:13px}

@media (max-width:640px){.brand-name{font-size:17px}h1{font-size:23px}}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}

<header class="topbar"><div class="topbar-in">
  <div class="brand"><div class="brand-mark" aria-hidden="true">PMA</div><span class="brand-name">Approval Sewa Armada</span></div>
  <div class="spacer"></div>
  <span class="chip" id="storeChip"><span class="dot" id="storeDot"></span><span id="storeLabel">Menghubungkan…</span></span>

  <button class="btn small" id="logoutBtn" hidden>Keluar</button>

<main id="app" class="wrap"></main>
<div id="panelRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
// Akun prototype: hanya memisahkan tampilan, bukan pengaman (terlihat di source)
const ACCOUNTS=[{u:'area',p:'pma-area',role:'area'},{u:'manager',p:'pma-manager',role:'manager'}];
const TYPES={RS:'Retail small',RL:'Retail large',GR:'Grosir'};
const SOURCE_SHEET='https://docs.google.com/spreadsheets/d/1kxzxy3URR0qc65H0xXi-XBapluEA66ywPtHHadzN4B0/edit';
const DEFAULT_CFG={ambangDalam:150,ambangLuar:120,jamKerja:10,kecepatan:40,layanan:{RS:6,RL:15,GR:60},tipeDefault:'RS',
  kmPPDefault:'',kmAntarDefault:'',kubikSewaDefault:2.7,regionLuar:[],abaikanMerged:true,feedId:'1A7r7MXNrofvDGZ23uWFCrROk_GdUhY8ysCchWodB6FA'};
const DRIVE='Google Drive';

const S={role:null,cfg:clone(DEFAULT_CFG),master:{depos:{}},depoSet:{},cust:{},subs:[],pending:null,tab:'keputusan',areaPlant:'',mgrDate:'',openId:null,notice:'',confirmReplace:null,dbSearch:'',dbRegion:'',mcp:undefined,sync:{state:'idle'},busy:{}};

function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n,d){d=d==null?2:d;return n==null||!isFinite(n)?'—':Number(n).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d})}
function pct(n){return n==null||!isFinite(n)?'—':Math.round(n*100)+'%'}
function rp(n){return n==null||!isFinite(n)?'—':'Rp '+Math.round(n).toLocaleString('id-ID')}
function fdate(s){if(!s)return '—';const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('id-ID',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
function ftime(iso){if(!iso)return '—';const d=new Date(iso);return isNaN(d)?'—':d.toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function $(id){return document.getElementById(id)}
function blank(v){return v===''||v==null}

// ---------- Penyimpanan bersama (db), fallback lokal ----------
const LS='pma-sewa-armada-v2';
const Store={mode:'connecting',db:null,local:null,listeners:{},
  async init(){let db=null;try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db')}catch(e){}
    if(db){this.db=db;this.mode='db'}else{this.mode='local';this.local=readLocal()}},
  watch(col,cb){
    if(this.mode==='db')return this.db.collection(col).onSnapshot(s=>cb(s.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()))),e=>{S.notice='Data tidak dapat dimuat ('+e.code+'). Muat ulang halaman.';render()});
    (this.listeners[col]=this.listeners[col]||[]).push(cb);cb(this.list(col));
  },
  list(col){const o=this.local[col]||{};return Object.keys(o).map(k=>Object.assign({id:k},o[k]))},
  notify(col){(this.listeners[col]||[]).forEach(cb=>cb(this.list(col)))},
  async set(col,id,data){if(this.mode==='db')return this.db.doc(col+'/'+id).set(data);(this.local[col]=this.local[col]||{})[id]=clone(data);writeLocal(this.local);this.notify(col)},
  async update(col,id,patch){if(this.mode==='db')return this.db.doc(col+'/'+id).update(patch);const c=(this.local[col]=this.local[col]||{});c[id]=Object.assign({},c[id]||{},clone(patch));writeLocal(this.local);this.notify(col)},
  async del(col,id){if(this.mode==='db')return this.db.doc(col+'/'+id).delete();if(this.local[col])delete this.local[col][id];writeLocal(this.local);this.notify(col)}
};
function readLocal(){try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v&&typeof v==='object')return v}catch(e){}return{}}
function writeLocal(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}
async function save(fn,okMsg){try{await fn();if(okMsg)toast(okMsg)}catch(e){const c=e&&e.code;S.notice=c==='quota_exceeded'?'Penyimpanan penuh. Hapus upload lama lalu coba lagi.':'Gagal menyimpan'+(c?' ('+c+')':'')+'. Coba lagi.';render()}}
let toastTimer=null;
function toast(msg){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)';document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true},2600)}

// ---------- Database armada dari Google Sheet ----------
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function num(v){if(v==null||v==='')return 0;if(typeof v==='number')return v;let s=String(v).trim();if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0}
function buildMaster(rows){
  const norm=v=>String(v==null?'':v).replace(/\uFEFF/g,'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
  const header=rows.findIndex(r=>r.some(v=>norm(v)==='PLANT ID')&&r.some(v=>norm(v)==='KUBIKASI'));
  if(header<0)throw Object.assign(new Error('Kolom PLANT ID dan KUBIKASI tidak ditemukan pada tab sumber.'),{code:'format'});
  rows=rows.slice(header);
  const h=rows[0]||[];const segs=[];let cur=null;
  h.forEach((name,i)=>{name=norm(name);if(!name)return;if(!cur||(name==='REGION'&&'PLANT ID' in cur.cols)||(name==='PLANT ID'&&'PLANT ID' in cur.cols)||(name==='KODE DP'&&'PLANT ID' in cur.cols)){cur={cols:{}};segs.push(cur)}if(!(name in cur.cols))cur.cols[name]=i});
  const depos={};let nKend=0;
  segs.filter(s=>'PLANT ID' in s.cols).forEach(s=>{
    const c=s.cols,isMT='STATUS MERGER' in c,src=isMT?'MT':'GT';
    rows.slice(1).forEach(r=>{
      const plant=String(r[c['PLANT ID']]||'').trim().toUpperCase();if(!/^P\d+$/.test(plant))return;
      const tipe=String(r[c['TIPE KENDARAAN']]||r[c['KATEGORI KENDARAAN']]||'LAINNYA').trim().toUpperCase();
      const kub=num(r[c['KUBIKASI']]);const merged=isMT&&/MERGED/i.test(String(r[c['STATUS MERGER']]||''));
      const d=depos[plant]=depos[plant]||{nama:String(r[c['NAMA DEPO']]||'').trim().toUpperCase(),region:String(r[c['REGION']]||'').trim(),site:String(r[c['SITE CODE']]||'').trim(),src:String(r[c['SUMBER DATA']]||src).trim().toUpperCase(),armada:[]};
      let a=d.armada.find(x=>x.tipe===tipe&&!!x.merged===merged);if(!a){a={tipe,unit:0,kubik:0,merged};d.armada.push(a)}
      a.unit++;a.kubik=+(a.kubik+kub).toFixed(3);nKend++;
    });
  });
  const ds=segs.find(s=>'KODE DP' in s.cols);
  if(ds){const c=ds.cols;rows.slice(1).forEach(r=>{
    const plant=String(r[c['PLANT LDC']]||'').trim().toUpperCase();if(!plant||!/^P\d+/.test(plant))return;
    const nama=String(r[c['NAMA DP']]||'').trim().toUpperCase(),reg=String(r[c['REGION']]||'').trim(),lp=String(r[c['DP/LP']]||'').trim().toUpperCase();
    const d=depos[plant];
    if(!d){depos[plant]={nama,region:reg,site:String(r[c['KODE DP']]||'').trim(),src:String(r[c['GT/MT']]||'').trim(),armada:[],dpName:nama,_lp:lp==='LP'};return}
    if(!d.dpName||(!d._lp&&lp==='LP')){d.dpName=nama;d._lp=lp==='LP';if(!d.site)d.site=String(r[c['KODE DP']]||'').trim()}
  })}
  Object.keys(depos).forEach(p=>{const d=depos[p];if(d.dpName)d.nama=d.dpName;delete d.dpName;delete d._lp;d.armada.sort((a,b)=>b.unit-a.unit)});
  return{depos,nKend};
}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+'-'+s.length}
function b64utf8(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}
const SYNC_MSG={server_not_connected:'Google Drive belum terhubung di akun Claude Anda. Tambahkan di Settings → Connectors, lalu klik Tarik ulang.',needs_reauth:'Koneksi Google Drive kedaluwarsa. Hubungkan ulang di Settings → Connectors, lalu klik Tarik ulang.',not_in_manifest:'Akses Google Drive untuk halaman ini tidak diizinkan. Izinkan saat diminta, lalu klik Tarik ulang.',selection_required:'Ada lebih dari satu koneksi Google Drive. Pilih salah satu saat diminta, lalu klik Tarik ulang.',blocked_by_policy:'Kebijakan organisasi memblokir akses Google Drive dari halaman ini.',server_unavailable:'Google Drive sedang tidak merespons. Coba Tarik ulang sebentar lagi.',tool_error:'Sheet feed tidak bisa dibaca. Pastikan akun Google Anda punya akses ke sheet "Feed Armada - Web Approval Sewa".',format:'Isi sheet feed tidak dikenali. Pastikan tab pertama berisi kolom PLANT ID dan KUBIKASI.',empty:'Sheet feed kosong. Periksa rumus IMPORTRANGE di sheet feed.'};
async function syncSheet(){
  if(!S.mcp){S.sync={state:'off'};render();return}
  S.sync={state:'loading'};render();
  try{
    const res=await S.mcp.callTool(DRIVE,'download_file_content',{fileId:S.cfg.feedId,exportMimeType:'text/csv'},{cache:false});
    const p=res&&res.payload;const b64=p&&typeof p==='object'?p.content:null;
    if(typeof b64!=='string')throw{code:'format'};
    const m=buildMaster(parseCSV(b64utf8(b64)));
    if(!Object.keys(m.depos).length)throw{code:'empty'};
    const sig=hashStr(JSON.stringify(m.depos));const now=new Date().toISOString();
    if(sig!==S.master.sig){await Store.set('master','armada',{depos:m.depos,sig,syncedAt:now,nKendaraan:m.nKend,nDepo:Object.keys(m.depos).length,feedId:S.cfg.feedId})}
    S.sync={state:'ok',at:now,changed:sig!==S.master.sig};
  }catch(e){S.sync={state:'error',code:e&&e.code,msg:(e&&SYNC_MSG[e.code])||('Gagal menarik data armada'+(e&&e.code?' ('+e.code+')':'')+'. Coba Tarik ulang.')}}
  render();
}

// ---------- Perhitungan ----------
function depoInfo(plant){
  const m=(S.master.depos||{})[plant];if(!m)return null;const set=S.depoSet[plant]||{},cfg=S.cfg;
  const arm=(m.armada||[]).filter(a=>!(cfg.abaikanMerged&&a.merged));
  const N=arm.reduce((s,a)=>s+a.unit,0),K=arm.reduce((s,a)=>s+a.kubik,0);
  const pulau=set.pulau||((cfg.regionLuar||[]).indexOf(m.region)>=0?'luar':'dalam');
  const kmPP=!blank(set.kmPP)?+set.kmPP:(!blank(cfg.kmPPDefault)?+cfg.kmPPDefault:null);
  const kmAntar=!blank(set.kmAntar)?+set.kmAntar:(!blank(cfg.kmAntarDefault)?+cfg.kmAntarDefault:null);
  const kubSewa=+set.kubikSewa||+cfg.kubikSewaDefault||2.7;
  return{plant,nama:m.nama,region:m.region,site:m.site,armada:arm,N,K,pulau,pulauSendiri:!!set.pulau,kmPP,kmAntar,kubSewa};
}
function evaluate(sub){
  const cfg=S.cfg,info=depoInfo(sub.plant),cmap=(S.cust[sub.plant]&&S.cust[sub.plant].map)||{};
  const r={D:sub.D,nToko:(sub.customers||[]).length,issues:[],types:{RS:0,RL:0,GR:0},info};
  (sub.customers||[]).forEach(c=>{const t=cmap[c.id]||cfg.tipeDefault||'RS';r.types[t]=(r.types[t]||0)+1});
  if(!info){r.issues.push('PLANT '+sub.plant+' tidak ada di Database Armada');r.rek='DATA';return r}
  Object.assign(r,{nama:info.nama,pulau:info.pulau,N:info.N,K:info.K,amb:(info.pulau==='luar'?cfg.ambangLuar:cfg.ambangDalam)/100,kubSewa:info.kubSewa});
  if(!r.K){r.issues.push('Depo belum punya armada di Database Armada');r.rek='DATA';return r}
  r.rasioK=r.D/r.K;r.capEff=r.K*r.amb;r.gapK=r.D-r.capEff;r.unitK=r.gapK>0?Math.ceil(r.gapK/r.kubSewa-1e-9):0;r.unitT=0;
  if(info.kmPP==null||info.kmAntar==null){r.timeMissing=true}
  else{
    r.svcMin=Object.keys(r.types).reduce((s,t)=>s+r.types[t]*(+cfg.layanan[t]||0),0);
    r.kmToko=info.kmAntar*r.nToko;r.jamJalan=r.kmToko/cfg.kecepatan;r.jamPP=info.kmPP/cfg.kecepatan;
    r.jamToko=r.svcMin/60+r.jamJalan;r.jamEfektif=cfg.jamKerja-r.jamPP;
    if(r.jamEfektif<=0){r.timeMissing=true;r.issues.push('Waktu pulang-pergi depo melebihi jam kerja')}
    else{r.jamTersedia=r.N*r.jamEfektif;r.rasioT=r.jamToko/r.jamTersedia;r.unitButuhT=Math.ceil(r.jamToko/r.jamEfektif-1e-9);r.unitT=Math.max(0,r.unitButuhT-r.N)}
  }
  r.unit=Math.max(r.unitK,r.unitT);r.rek=r.unit>0?'SEWA':'TIDAK';
  r.alasan=[];if(r.unitK>0)r.alasan.push('kubikasi '+pct(r.rasioK)+' > '+pct(r.amb));if(r.unitT>0)r.alasan.push('jam kerja '+pct(r.rasioT));
  return r;
}

function findCol(h,names){const low=h.map(x=>String(x).trim().toLowerCase());for(const n of names){const i=low.indexOf(n.toLowerCase());if(i>=0)return h[i]}return null}
function toISO(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600*1000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  if(typeof v==='number'&&window.XLSX){const o=XLSX.SSF.parse_date_code(v);if(o)return o.y+'-'+String(o.m).padStart(2,'0')+'-'+String(o.d).padStart(2,'0')}
  if(typeof v==='string'){let m=v.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=v.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  return null;
}
function parseFile(buf,fileName){
  const wb=XLSX.read(buf,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:null,raw:true});if(!rows.length)throw new Error('File tidak berisi baris data.');
  const h=Object.keys(rows[0]);
  const c={cap:findCol(h,['Line Item Capacity Usage 1']),cust:findCol(h,['SOLDTOCUSTOMERID',"Consignee's Contact Id"]),dno:findCol(h,['DELIVERYORDERID']),plant:findCol(h,['PLANT',"Shipper's Contact Id"]),route:findCol(h,['Route']),date:findCol(h,['Pickup Time']),val:findCol(h,['NETVALUE','NET_VALUE'])};
  if(!c.cap)throw new Error('Kolom "Line Item Capacity Usage 1" tidak ditemukan. Pastikan ini file export DO Zyllem.');
  if(!c.cust)throw new Error('Kolom customer (SOLDTOCUSTOMERID) tidak ditemukan.');
  if(!c.plant)throw new Error('Kolom PLANT tidak ditemukan, depo tidak bisa dikenali.');
  const by={};
  rows.forEach(r=>{
    const plant=String(r[c.plant]||'').trim().toUpperCase();if(!plant)return;
    const g=by[plant]=by[plant]||{plant,rows:0,D:0,nilai:0,dos:new Set(),dates:{},cust:{},routes:{}};
    const cap=num(r[c.cap]),val=c.val?num(r[c.val]):0,cid=String(r[c.cust]||'').trim()||'(tanpa id)',rt=c.route?String(r[c.route]||'-'):'-',dno=c.dno?String(r[c.dno]):'';
    g.rows++;g.D+=cap;g.nilai+=val;if(dno)g.dos.add(dno);
    const dt=c.date?toISO(r[c.date]):null;if(dt)g.dates[dt]=(g.dates[dt]||0)+1;
    const cu=g.cust[cid]=g.cust[cid]||{id:cid,cub:0,nilai:0,dos:new Set(),route:rt};cu.cub+=cap;cu.nilai+=val;if(dno)cu.dos.add(dno);
    const ro=g.routes[rt]=g.routes[rt]||{route:rt,D:0,cust:new Set(),dos:new Set()};ro.D+=cap;ro.cust.add(cid);if(dno)ro.dos.add(dno);
  });
  const out=Object.values(by).map(g=>{const ds=Object.keys(g.dates).sort((a,b)=>g.dates[b]-g.dates[a]);
    return{plant:g.plant,tanggal:ds[0]||'',fileName,nBaris:g.rows,D:+g.D.toFixed(5),nilai:Math.round(g.nilai),nDO:g.dos.size,
      customers:Object.values(g.cust).map(x=>({id:x.id,cub:+x.cub.toFixed(5),nilai:Math.round(x.nilai),nDO:x.dos.size,route:x.route})).sort((a,b)=>b.cub-a.cub),
      routes:Object.values(g.routes).map(x=>({route:x.route,D:+x.D.toFixed(5),nToko:x.cust.size,nDO:x.dos.size})).sort((a,b)=>b.D-a.D)}});
  if(!out.length)throw new Error('Tidak ada baris dengan kode PLANT.');return out;
}

    (list.length?list.slice(0,400).map(p=>{const i=depoInfo(p),set=S.depoSet[p]||{};const mergedN=(S.master.depos[p].armada||[]).filter(a=>a.merged).reduce((s,a)=>s+a.unit,0);
      return '<tr><td><b>'+esc(p)+'</b></td><td>'+esc(i.nama)+'<div class="muted small">'+esc(i.region)+'</div></td><td class="small">'+(i.armada.map(a=>esc(a.unit+'× '+a.tipe)).join('<br>')||'<span class="muted">—</span>')+(mergedN&&S.cfg.abaikanMerged?'<div class="muted small">'+mergedN+' unit MT merged diabaikan</div>':'')+'</td><td class="r num">'+i.N+'</td><td class="r num">'+fmt(i.K)+'</td>'+
      '<td><select class="in tight" style="width:120px" data-set="'+esc(p)+'" data-k="pulau" id="ps-'+esc(p)+'"><option value=""'+(!set.pulau?' selected':'')+'>Ikut region ('+((S.cfg.regionLuar||[]).indexOf(i.region)>=0?'luar':'dalam')+')</option><option value="dalam"'+(set.pulau==='dalam'?' selected':'')+'>Dalam</option><option value="luar"'+(set.pulau==='luar'?' selected':'')+'>Luar</option></select></td>'+
      '<td><input class="in tight" type="number" min="0" step="1" data-set="'+esc(p)+'" data-k="kmPP" id="pp-'+esc(p)+'" value="'+esc(blank(set.kmPP)?'':set.kmPP)+'" placeholder="'+esc(blank(S.cfg.kmPPDefault)?'—':S.cfg.kmPPDefault)+'"></td>'+
      '<td><input class="in tight" type="number" min="0" step="0.1" data-set="'+esc(p)+'" data-k="kmAntar" id="at-'+esc(p)+'" value="'+esc(blank(set.kmAntar)?'':set.kmAntar)+'" placeholder="'+esc(blank(S.cfg.kmAntarDefault)?'—':S.cfg.kmAntarDefault)+'"></td>'+
      '<td><input class="in tight" type="number" min="0" step="0.1" data-set="'+esc(p)+'" data-k="kubikSewa" id="ks-'+esc(p)+'" value="'+esc(blank(set.kubikSewa)?'':set.kubikSewa)+'" placeholder="'+esc(S.cfg.kubikSewaDefault)+'"></td></tr>'}).join('')
    :'<tr><td colspan="9" class="empty">'+(all.length?'Tidak ada depo yang cocok.':'Database armada belum tersinkron. Klik Tarik ulang dari sheet.')+'</td></tr>')+'</tbody></table></div>';
  return h;
}
function viewParams(){
  const c=S.cfg,regions=[...new Set(Object.values(S.master.depos||{}).map(d=>d.region).filter(Boolean))].sort();
  return '<div style="display:flex;flex-direction:column;gap:6px"><h1>Parameter</h1><p class="sub">Semua angka bisa diubah. Rekomendasi untuk pengajuan yang belum diputuskan langsung ikut berubah.</p></div>'+
  '<section class="card"><h2>Ambang kubikasi</h2><div class="grid2"><label class="f">Dalam pulau: sewa bila DO ÷ armada di atas (%)<input id="pDalam" type="number" min="50" step="5" value="'+c.ambangDalam+'"></label><label class="f">Luar pulau: sewa bila DO ÷ armada di atas (%)<input id="pLuar" type="number" min="50" step="5" value="'+c.ambangLuar+'"></label><label class="f">Kubikasi 1 unit sewa, default (m³)<input id="pSewa" type="number" min="0.5" step="0.1" value="'+c.kubikSewaDefault+'"></label></div>'+
  '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="pMerged"'+(c.abaikanMerged?' checked':'')+'> Abaikan unit di tab ARMADA MT berstatus MERGED_TO_GT (agar tidak terhitung dua kali)</label></section>'+
  '<section class="card"><h2>Region luar pulau</h2><p class="muted small">Centang region yang memakai ambang luar pulau. Depo tertentu bisa diatur sendiri di tab Database armada.</p><div class="checks">'+
    (regions.length?regions.map((r,i)=>'<label><input type="checkbox" id="rg-'+i+'" data-region="'+esc(r)+'"'+((c.regionLuar||[]).indexOf(r)>=0?' checked':'')+'> '+esc(r)+'</label>').join(''):'<span class="muted small">Region muncul setelah database armada tersinkron.</span>')+'</div></section>'+
  '<section class="card"><h2>Waktu kerja armada</h2><div class="grid2"><label class="f">Jam kerja per unit per hari<input id="pJam" type="number" min="1" step="0.5" value="'+c.jamKerja+'"></label><label class="f">Kecepatan rata-rata (km/jam)<input id="pSpeed" type="number" min="5" step="1" value="'+c.kecepatan+'"></label>'+
  '<label class="f">Retail small (menit/toko)<input id="pRS" type="number" min="0" step="1" value="'+c.layanan.RS+'"></label><label class="f">Retail large (menit/toko)<input id="pRL" type="number" min="0" step="1" value="'+c.layanan.RL+'"></label><label class="f">Grosir (menit/toko)<input id="pGR" type="number" min="0" step="1" value="'+c.layanan.GR+'"></label>'+
  '<label class="f">Tipe default toko baru<select id="pDef">'+Object.keys(TYPES).map(k=>'<option value="'+k+'"'+(k===c.tipeDefault?' selected':'')+'>'+TYPES[k]+'</option>').join('')+'</select></label>'+
  '<label class="f">Jarak PP depo default (km)<input id="pPP" type="number" min="0" step="1" value="'+esc(c.kmPPDefault)+'" placeholder="kosong = belum diisi"></label><label class="f">Jarak antar toko default (km)<input id="pAT" type="number" min="0" step="0.1" value="'+esc(c.kmAntarDefault)+'" placeholder="kosong = belum diisi"></label></div>'+
  '<p class="muted small">Tanpa jarak, cek jam kerja dilewati dan rekomendasi hanya memakai kubikasi.</p></section>'+
  '<section class="card"><h2>Sumber data</h2><label class="f">ID Google Sheet feed armada<input id="pFeed" value="'+esc(c.feedId)+'"></label><p class="muted small">Sheet feed menarik tab ARMADA GT, ARMADA MT, dan KD DEPO &amp; DIST dari Database Armada dengan IMPORTRANGE, tanpa kolom nama driver. <a href="https://docs.google.com/spreadsheets/d/'+esc(c.feedId)+'/edit" target="_blank" rel="noopener">Buka sheet feed</a></p></section>'+
  '<div class="row"><button class="btn primary" data-act="saveParams">Simpan parameter</button><button class="btn" data-act="resetParams">Kembalikan ke awal</button></div>';
}

// ---------- Panel hitungan (read-only) ----------
function viewPanel(){
  const s=S.subs.find(x=>x.id===S.openId);if(!s)return '';const r=evaluate(s),cmap=(S.cust[s.plant]&&S.cust[s.plant].map)||{};
  let h='<div class="scrim" data-act="close"></div><aside class="panel" role="dialog" aria-modal="true" aria-label="Hitungan rekomendasi"><div class="panel-head"><div style="flex:1;min-width:0"><h2>'+esc(s.plant)+(r.nama?' · '+esc(r.nama):'')+'</h2><p class="muted small">'+fdate(s.tanggal)+' · upload '+ftime(s.uploadedAt)+' · '+esc(s.fileName||'')+'</p></div><button class="btn small" data-act="close">Tutup</button></div><div class="panel-body">';
  r.issues.forEach(i=>{h+='<p class="notice">'+esc(i)+'.</p>'});
  const cls=r.rek==='SEWA'?'sewa':r.rek==='TIDAK'?'ok':'wait';
  h+='<div class="verdict '+cls+'"><span class="small" style="font-weight:600;text-transform:uppercase;letter-spacing:.06em">Rekomendasi sistem</span><span class="big">'+(r.rek==='SEWA'?'Sewa '+r.unit+' unit':r.rek==='TIDAK'?'Tidak perlu sewa':'Belum bisa dihitung')+'</span>'+(r.alasan&&r.alasan.length?'<span>Dipicu oleh '+esc(r.alasan.join(' dan '))+'.</span>':'')+'</div>';
  if(r.info)h+='<section class="card"><h3>Cek kubikasi</h3><dl class="kv"><dt>Kubikasi DO</dt><dd>'+fmt(r.D)+' m³</dd><dt>Armada ('+r.info.armada.map(a=>a.unit+'× '+a.tipe).join(', ')+')</dt><dd>'+fmt(r.K)+' m³</dd><dt>Rasio DO ÷ armada</dt><dd>'+pct(r.rasioK)+'</dd><dt>Batas '+r.pulau+' pulau</dt><dd>'+pct(r.amb)+'</dd><dt>Kapasitas efektif (armada × batas)</dt><dd>'+fmt(r.capEff)+' m³</dd><dt>Kelebihan volume</dt><dd>'+fmt(Math.max(0,r.gapK||0))+' m³</dd><dt class="tot">Unit sewa (÷ '+fmt(r.kubSewa,1)+' m³)</dt><dd class="tot">'+(r.unitK==null?'—':r.unitK)+'</dd></dl></section>'+
    '<section class="card"><h3>Cek jam kerja</h3>'+(r.timeMissing?'<p class="muted small">Jarak depo belum diisi, cek ini dilewati. Isi di tab Database armada atau Parameter.</p>':'<dl class="kv"><dt>Layanan: '+r.types.RS+' retail small · '+r.types.RL+' retail large · '+r.types.GR+' grosir</dt><dd>'+fmt(r.svcMin/60,1)+' jam</dd><dt>Jalan antar toko ('+fmt(r.kmToko,0)+' km ÷ '+S.cfg.kecepatan+' km/jam)</dt><dd>'+fmt(r.jamJalan,1)+' jam</dd><dt>Jam dibutuhkan</dt><dd>'+fmt(r.jamToko,1)+' jam</dd><dt>Jam efektif per unit ('+S.cfg.jamKerja+' − PP '+fmt(r.jamPP,1)+')</dt><dd>'+fmt(r.jamEfektif,1)+' jam</dd><dt>Tersedia ('+r.N+' unit)</dt><dd>'+fmt(r.jamTersedia,1)+' jam</dd><dt class="tot">Unit sewa ('+r.unitButuhT+' butuh − '+r.N+' milik)</dt><dd class="tot">'+r.unitT+'</dd></dl>')+'</section>';
  h+='<section class="card"><h3>Per route sales</h3><div class="tablewrap"><table><thead><tr><th>Route</th><th class="r">Kubikasi</th><th class="r">Toko</th><th class="r">DO</th></tr></thead><tbody>'+(s.routes||[]).map(x=>'<tr><td>'+esc(x.route)+'</td><td class="r num">'+fmt(x.D,3)+'</td><td class="r num">'+x.nToko+'</td><td class="r num">'+x.nDO+'</td></tr>').join('')+'</tbody></table></div></section>';
  h+='<section class="card"><h3>Toko terbesar</h3><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Tipe</th><th class="r">Kubikasi</th><th class="r">% depo</th></tr></thead><tbody>'+(s.customers||[]).slice(0,10).map(c=>'<tr><td class="num">'+esc(c.id)+'</td><td>'+TYPES[cmap[c.id]||S.cfg.tipeDefault]+'</td><td class="r num">'+fmt(c.cub,3)+'</td><td class="r num">'+pct(c.cub/s.D)+'</td></tr>').join('')+'</tbody></table></div></section>';
  return h+'</div></aside>';
}

// ---------- Render ----------
function render(){
  const active=document.activeElement&&document.activeElement.id,selS=document.activeElement&&document.activeElement.selectionStart;
  $('storeDot').className='dot '+(Store.mode==='db'?'on':Store.mode==='local'?'local':'');
  $('storeLabel').textContent=Store.mode==='db'?'Data bersama aktif':Store.mode==='local'?'Mode lokal: hanya di browser ini':'Menghubungkan…';
  $('roleChip').hidden=!S.role;$('logoutBtn').hidden=!S.role;$('roleName').textContent=S.role==='manager'?'Manager':S.role==='area'?'Area':'';
  const app=$('app');
  if(!S.role){app.innerHTML=viewLogin();$('panelRoot').innerHTML='';return}
  if(Store.mode==='connecting'){app.innerHTML='<div class="card"><p class="empty">Memuat data…</p></div>';return}
  app.innerHTML=S.role==='area'?viewArea():viewManager();
  $('panelRoot').innerHTML=S.role==='manager'&&S.openId?viewPanel():'';
  if(active&&$(active)&&active!=='fileIn'){const el=$(active);try{el.focus();if(selS!=null&&el.setSelectionRange&&el.type!=='number')el.setSelectionRange(selS,selS)}catch(e){}}
}

// ---------- Event ----------
document.addEventListener('submit',e=>{
  if(e.target.id!=='loginForm')return;e.preventDefault();
  const u=$('lgUser').value.trim().toLowerCase(),p=$('lgPass').value,acc=ACCOUNTS.find(a=>a.u===u&&a.p===p);
  if(!acc){$('lgErr').hidden=false;return}
  S.role=acc.role;try{sessionStorage.setItem('pma-role',acc.role)}catch(x){}
  render();afterLogin();
});
$('logoutBtn').addEventListener('click',()=>{S.role=null;S.openId=null;S.pending=null;try{sessionStorage.removeItem('pma-role')}catch(x){}render()});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='tab'){S.tab=b.dataset.tab;render()}
  else if(act==='open'){S.openId=b.dataset.id;render()}
  else if(act==='close'){S.openId=null;render()}
  else if(act==='decide'){decide(b.dataset.id,b.dataset.v)}
  else if(act==='undo'){save(()=>Store.update('submissions',b.dataset.id,{status:'menunggu',keputusan:null}),'Keputusan dibuka kembali')}
  else if(act==='bulk'){bulkDecide()}
  else if(act==='sync'){syncSheet()}
  else if(act==='saveParams'){saveParams()}
  else if(act==='resetParams'){S.cfg=clone(DEFAULT_CFG);save(()=>Store.set('config','settings',S.cfg),'Parameter dikembalikan')}
  else if(act==='submitPending'){submitPending(!!b.dataset.force)}
  else if(act==='cancelPending'){S.pending=null;S.confirmReplace=null;render()}
  else if(act==='cancelReplace'){S.confirmReplace=null;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.openId){S.openId=null;render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='dbSearch'){S.dbSearch=t.value;render()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fileIn'&&t.files&&t.files[0])readFile(t.files[0]);
  else if(t.id==='areaPlant'){S.areaPlant=t.value;render()}
  else if(t.id==='mgrDate'){S.mgrDate=t.value;render()}
  else if(t.id==='dbRegion'){S.dbRegion=t.value;render()}
  else if(t.dataset.cid!=null&&S.pending){const g=S.pending.groups[+t.dataset.gi];g.types=g.types||{};g.types[t.dataset.cid]=t.value}
  else if(t.id&&t.id.indexOf('pdate-')===0&&S.pending){S.pending.groups[+t.dataset.gi].tanggal=t.value;render()}
  else if(t.dataset.set){const p=t.dataset.set,k=t.dataset.k;const cur=Object.assign({},S.depoSet[p]||{});cur[k]=k==='pulau'?t.value:(t.value===''?'':+t.value);cur.updatedAt=new Date().toISOString();S.depoSet[p]=cur;save(()=>Store.set('depoSet',p,cur),'Pengaturan '+p+' disimpan')}
});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('hover')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('hover')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('hover');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)readFile(f)}});

function readFile(f){
  if(!window.XLSX){S.notice='Pembaca Excel belum termuat. Periksa koneksi lalu muat ulang halaman.';render();return}
  const fr=new FileReader();
  fr.onload=()=>{try{S.pending={groups:parseFile(new Uint8Array(fr.result),f.name)};S.notice='';S.confirmReplace=null}catch(err){S.notice=err.message||'File tidak dapat dibaca.'}render()};
  fr.onerror=()=>{S.notice='File tidak dapat dibaca.';render()};fr.readAsArrayBuffer(f);
}
async function submitPending(force){
  const p=S.pending;if(!p)return;
  for(const g of p.groups){if(!g.tanggal){S.notice='Isi tanggal kirim untuk '+g.plant+'.';render();return}}
  if(!force){const dec=p.groups.map(g=>S.subs.find(s=>s.id===subId(g.plant,g.tanggal))).filter(s=>s&&s.status!=='menunggu');if(dec.length){S.confirmReplace=dec.map(s=>s.plant+' '+fdate(s.tanggal)).join(', ');render();return}}
  const now=new Date().toISOString();
  try{
    for(const g of p.groups){
      const cur=(S.cust[g.plant]&&S.cust[g.plant].map)||{},map=Object.assign({},cur);
      g.customers.forEach(c=>{map[c.id]=(g.types&&g.types[c.id])||cur[c.id]||S.cfg.tipeDefault});
      await Store.set('customers',g.plant,{map,updatedAt:now});
      await Store.set('submissions',subId(g.plant,g.tanggal),{plant:g.plant,tanggal:g.tanggal,fileName:g.fileName,nBaris:g.nBaris,D:g.D,nilai:g.nilai,nDO:g.nDO,customers:g.customers,routes:g.routes,uploadedAt:now,status:'menunggu',keputusan:null});
    }
    S.pending=null;S.confirmReplace=null;S.notice='';render();toast('Terkirim ke manager');
  }catch(e){S.notice='Gagal mengirim'+(e&&e.code?' ('+e.code+')':'')+'. Coba lagi.';render()}
}
function decisionDoc(s,v){const r=evaluate(s);return{status:v,keputusan:{unit:v==='sewa'?Math.max(1,r.unit||0):0,at:new Date().toISOString(),ikutRekomendasi:(v==='sewa')===(r.rek==='SEWA'),snapshot:{D:r.D,K:r.K||null,N:r.N||null,rasioK:r.rasioK||null,rasioT:r.rasioT||null,rek:r.rek,unitRek:r.unit||0}}}}
function decide(id,v){const s=S.subs.find(x=>x.id===id);if(!s)return;save(()=>Store.update('submissions',id,decisionDoc(s,v)),v==='sewa'?'Sewa '+s.plant+' di-approve':s.plant+': tidak sewa')}
async function bulkDecide(){
  const list=S.subs.filter(s=>(S.mgrDate==='semua'||s.tanggal===S.mgrDate)&&s.status==='menunggu').map(s=>({s,r:evaluate(s)})).filter(x=>x.r.rek!=='DATA');
  try{for(const x of list)await Store.update('submissions',x.s.id,decisionDoc(x.s,x.r.rek==='SEWA'?'sewa':'tidak'));toast(list.length+' depo diputuskan sesuai rekomendasi')}catch(e){S.notice='Sebagian keputusan gagal disimpan'+(e&&e.code?' ('+e.code+')':'')+'. Coba lagi.';render()}
}
function saveParams(){
  const v=id=>+$(id).value,raw=id=>$(id).value.trim();
  const regionLuar=[...document.querySelectorAll('[data-region]')].filter(x=>x.checked).map(x=>x.dataset.region);
  const c={ambangDalam:v('pDalam'),ambangLuar:v('pLuar'),kubikSewaDefault:v('pSewa'),abaikanMerged:$('pMerged').checked,regionLuar,jamKerja:v('pJam'),kecepatan:v('pSpeed'),layanan:{RS:v('pRS'),RL:v('pRL'),GR:v('pGR')},tipeDefault:$('pDef').value,kmPPDefault:raw('pPP')===''?'':+raw('pPP'),kmAntarDefault:raw('pAT')===''?'':+raw('pAT'),feedId:raw('pFeed')||DEFAULT_CFG.feedId};
  if(!(c.jamKerja>0&&c.kecepatan>0&&c.ambangDalam>0&&c.ambangLuar>0&&c.kubikSewaDefault>0)){S.notice='Ambang, kubikasi unit sewa, jam kerja, dan kecepatan harus lebih dari 0.';render();return}
  const feedChanged=c.feedId!==S.cfg.feedId;S.cfg=c;S.notice='';
  save(()=>Store.set('config','settings',c),'Parameter disimpan').then(()=>{if(feedChanged)syncSheet()});
}

// ---------- Start ----------
let synced=false;
function afterLogin(){if(S.role==='manager'&&!synced&&Store.mode!=='connecting'&&S.mcp!==undefined){synced=true;syncSheet()}}
try{const r=sessionStorage.getItem('pma-role');if(r==='area'||r==='manager')S.role=r}catch(e){}
render();
Store.init().then(()=>{
  Store.watch('submissions',l=>{S.subs=l;render()});
  Store.watch('depoSet',l=>{const o={};l.forEach(d=>{o[d.id]=d});S.depoSet=o;render()});
  Store.watch('customers',l=>{const o={};l.forEach(d=>{o[d.id]=d});S.cust=o;render()});
  Store.watch('master',l=>{const m=l.find(d=>d.id==='armada');S.master=m||{depos:{}};render()});
  Store.watch('config',l=>{const s=l.find(d=>d.id==='settings');S.cfg=Object.assign(clone(DEFAULT_CFG),s||{});S.cfg.layanan=Object.assign({},DEFAULT_CFG.layanan,(s&&s.layanan)||{});delete S.cfg.id;render()});
  render();afterLogin();
});
(async()=>{let m=null;try{if(window.claude&&typeof window.claude.use==='function')m=await window.claude.use('mcp')}catch(e){}S.mcp=m;if(!m)S.sync={state:'off'};render();afterLogin()})();
})();
</script>
